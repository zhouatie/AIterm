name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos-arm64:
    name: Build macOS arm64
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ "${GITHUB_REF_NAME}" != v* ]]; then
            echo "::error::Release tag must start with v, got ${GITHUB_REF_NAME}"
            exit 1
          fi

          if [[ "${tag_version}" != "${package_version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${package_version}"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Make distributable
        run: npm run make

      - name: Resolve release artifact
        id: artifact
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(out/make/zip/darwin/arm64/*.zip)

          if (( ${#artifacts[@]} != 1 )); then
            echo "::error::Expected exactly one macOS arm64 ZIP in out/make/zip/darwin/arm64, found ${#artifacts[@]}"
            printf '%s\n' "${artifacts[@]}"
            exit 1
          fi

          echo "path=${artifacts[0]}" >> "${GITHUB_OUTPUT}"
          echo "name=$(basename "${artifacts[0]}")" >> "${GITHUB_OUTPUT}"

      - name: Create release and upload ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_PATH: ${{ steps.artifact.outputs.path }}
        shell: bash
        run: |
          notes="macOS arm64 ZIP for AIterm ${GITHUB_REF_NAME}."

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${ARTIFACT_PATH}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${ARTIFACT_PATH}" \
              --title "AIterm ${GITHUB_REF_NAME}" \
              --notes "${notes}"
          fi
